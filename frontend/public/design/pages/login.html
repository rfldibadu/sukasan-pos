<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sukasan POS - Staff Terminal Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amber: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
              800: '#92400e',
              900: '#78350f',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/design-system.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- Prototype Banner -->
  <div class="bg-amber-800 text-amber-50 text-xs py-1.5 px-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-blue-400"></span>
      <span class="font-medium">PROTOTYPE: Staff Terminal Login &bull; PIN Numpad</span>
    </div>
    <a href="../index.html" class="underline hover:text-white font-semibold">Back to Design Hub</a>
  </div>

  <main class="max-w-md w-full mx-auto px-4 py-8 flex-1 flex flex-col justify-center">

    <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm space-y-6">

      <!-- Brand Logo Header -->
      <div class="text-center space-y-1">
        <div class="w-14 h-14 rounded-2xl bg-amber-700 text-white mx-auto flex items-center justify-center shadow-md">
          <i data-lucide="coffee" class="w-8 h-8"></i>
        </div>
        <h1 class="text-xl font-black text-slate-900 pt-2">Sukasan Coffee</h1>
        <p class="text-xs text-slate-500">Jl. Achmad Nadjamuddin No.20 &bull; POS Terminal</p>
      </div>

      <!-- Mode Toggle: Cashier PIN vs Manager Email -->
      <div class="grid grid-cols-2 p-1 bg-slate-100 rounded-2xl text-xs font-semibold">
        <button id="btnPinMode" onclick="setLoginMode('pin')" class="py-2 rounded-xl bg-white text-slate-900 shadow-2xs">
          Cashier PIN
        </button>
        <button id="btnEmailMode" onclick="setLoginMode('email')" class="py-2 rounded-xl text-slate-600 hover:text-slate-900">
          Manager Email
        </button>
      </div>

      <!-- Cashier PIN Numpad View -->
      <div id="pinSection" class="space-y-5">
        <div class="text-center space-y-2" id="pinDotsWrapper">
          <p class="text-xs font-medium text-slate-500">Enter your 4-digit Cashier PIN</p>
          <!-- PIN Dots Indicator -->
          <div class="flex justify-center gap-3">
            <div id="dot0" class="w-4 h-4 rounded-full border-2 border-slate-300 transition-all"></div>
            <div id="dot1" class="w-4 h-4 rounded-full border-2 border-slate-300 transition-all"></div>
            <div id="dot2" class="w-4 h-4 rounded-full border-2 border-slate-300 transition-all"></div>
            <div id="dot3" class="w-4 h-4 rounded-full border-2 border-slate-300 transition-all"></div>
          </div>
        </div>

        <!-- Touch Numpad Grid -->
        <div class="grid grid-cols-3 gap-2.5 max-w-xs mx-auto">
          <button onclick="pressKey('1')" class="h-14 rounded-2xl bg-slate-50 hover:bg-slate-100 active:bg-amber-100 text-base font-bold text-slate-800 transition-colors shadow-2xs">1</button>
          <button onclick="pressKey('2')" class="h-14 rounded-2xl bg-slate-50 hover:bg-slate-100 active:bg-amber-100 text-base font-bold text-slate-800 transition-colors shadow-2xs">2</button>
          <button onclick="pressKey('3')" class="h-14 rounded-2xl bg-slate-50 hover:bg-slate-100 active:bg-amber-100 text-base font-bold text-slate-800 transition-colors shadow-2xs">3</button>

          <button onclick="pressKey('4')" class="h-14 rounded-2xl bg-slate-50 hover:bg-slate-100 active:bg-amber-100 text-base font-bold text-slate-800 transition-colors shadow-2xs">4</button>
          <button onclick="pressKey('5')" class="h-14 rounded-2xl bg-slate-50 hover:bg-slate-100 active:bg-amber-100 text-base font-bold text-slate-800 transition-colors shadow-2xs">5</button>
          <button onclick="pressKey('6')" class="h-14 rounded-2xl bg-slate-50 hover:bg-slate-100 active:bg-amber-100 text-base font-bold text-slate-800 transition-colors shadow-2xs">6</button>

          <button onclick="pressKey('7')" class="h-14 rounded-2xl bg-slate-50 hover:bg-slate-100 active:bg-amber-100 text-base font-bold text-slate-800 transition-colors shadow-2xs">7</button>
          <button onclick="pressKey('8')" class="h-14 rounded-2xl bg-slate-50 hover:bg-slate-100 active:bg-amber-100 text-base font-bold text-slate-800 transition-colors shadow-2xs">8</button>
          <button onclick="pressKey('9')" class="h-14 rounded-2xl bg-slate-50 hover:bg-slate-100 active:bg-amber-100 text-base font-bold text-slate-800 transition-colors shadow-2xs">9</button>

          <button onclick="clearPin()" class="h-14 rounded-2xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-600 transition-colors">Clear</button>
          <button onclick="pressKey('0')" class="h-14 rounded-2xl bg-slate-50 hover:bg-slate-100 active:bg-amber-100 text-base font-bold text-slate-800 transition-colors shadow-2xs">0</button>
          <button onclick="backspacePin()" class="h-14 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition-colors">
            <i data-lucide="delete" class="w-5 h-5"></i>
          </button>
        </div>

        <div class="text-center pt-2">
          <p class="text-[11px] text-slate-400">Demo PIN: <strong class="text-amber-800">1 2 3 4</strong></p>
        </div>
      </div>

      <!-- Manager Email/Password View (Hidden by default) -->
      <div id="emailSection" class="space-y-4 hidden">
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-700">Manager Email / Username</label>
          <input type="email" placeholder="manager@sukasan.com" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:outline-none focus:border-amber-600">
        </div>
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-700">Password</label>
          <input type="password" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:outline-none focus:border-amber-600">
        </div>
        <button onclick="window.location.href='dashboard.html'" class="w-full py-3 bg-amber-700 hover:bg-amber-800 text-white rounded-xl text-xs font-bold shadow-xs">
          Sign In to Backoffice
        </button>
      </div>

    </div>

  </main>

  <footer class="py-4 text-center text-xs text-slate-400">
    Sukasan POS &bull; Shift Login Gateway
  </footer>

  <script src="../assets/js/prototype.js"></script>
  <script>
    let currentPin = '';

    function setLoginMode(mode) {
      const bPin = document.getElementById('btnPinMode');
      const bEmail = document.getElementById('btnEmailMode');
      const pSec = document.getElementById('pinSection');
      const eSec = document.getElementById('emailSection');

      if (mode === 'pin') {
        bPin.className = 'py-2 rounded-xl bg-white text-slate-900 shadow-2xs';
        bEmail.className = 'py-2 rounded-xl text-slate-600 hover:text-slate-900';
        pSec.classList.remove('hidden');
        eSec.classList.add('hidden');
      } else {
        bEmail.className = 'py-2 rounded-xl bg-white text-slate-900 shadow-2xs';
        bPin.className = 'py-2 rounded-xl text-slate-600 hover:text-slate-900';
        eSec.classList.remove('hidden');
        pSec.classList.add('hidden');
      }
    }

    function pressKey(key) {
      if (currentPin.length < 4) {
        currentPin += key;
        updateDots();
        if (currentPin.length === 4) {
          setTimeout(() => {
            if (currentPin === '1234') {
              showToast('PIN Verified! Cashier shift opened.', 'success');
              setTimeout(() => {
                window.location.href = 'pos.html';
              }, 600);
            } else {
              // Shake and reset
              shakeElement('pinDotsWrapper');
              showToast('Incorrect PIN! Try 1234 for demo.', 'error');
              for (let i = 0; i < 4; i++) {
                const dot = document.getElementById('dot' + i);
                dot.className = 'w-4 h-4 rounded-full bg-rose-600 border-2 border-rose-600';
              }
              setTimeout(() => {
                clearPin();
              }, 600);
            }
          }, 200);
        }
      }
    }

    function clearPin() {
      currentPin = '';
      updateDots();
    }

    function backspacePin() {
      if (currentPin.length > 0) {
        currentPin = currentPin.slice(0, -1);
        updateDots();
      }
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById('dot' + i);
        if (i < currentPin.length) {
          dot.className = 'w-4 h-4 rounded-full bg-amber-700 border-2 border-amber-700 scale-110 transition-all';
        } else {
          dot.className = 'w-4 h-4 rounded-full border-2 border-slate-300 transition-all';
        }
      }
    }
  </script>
</body>
</html>
